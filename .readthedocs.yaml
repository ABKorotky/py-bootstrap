# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    # Full history + tags so setuptools-scm can resolve the version.
    post_checkout:
      - git fetch --unshallow || true
      - git fetch --tags || true
    pre_build:
      # Doc tooling lives in the `docs` dependency group (PEP 735).
      - python -m pip install --upgrade pip
      - python -m pip install --group docs
      # Regenerate the API reference stubs (docs/modules/ is gitignored).
      - sphinx-apidoc --separate --force --no-toc --module-first --ext-viewcode --output-dir docs/modules py_bootstrap

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    - method: pip
      path: .

formats:
  - pdf
